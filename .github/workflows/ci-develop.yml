name: CI (develop)

# Fork CI for the `develop` integration branch.
#
# The upstream test workflows (tests-linux/macos/windows.yml) only trigger on `main` and
# `release/v*`, and their test jobs target `runs-on: [<os>, self-hosted]` — which requires BOTH
# labels, so they never start on a fork with no self-hosted runners. This workflow covers
# `develop` on GitHub-hosted runners instead, and reuses the same composite actions under
# .github/actions/ so there is no second copy of the build/test recipe to keep in sync.
#
# Kept as a separate file rather than editing the upstream workflows, so syncing from
# usebruno/bruno stays conflict-free.

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # eslint-plugin-diff needs the base branch present to diff against.
          fetch-depth: 0

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      - name: Lint Check
        run: npm run lint
        env:
          ESLINT_PLUGIN_DIFF_COMMIT: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/develop' }}

  unit-test:
    name: Unit Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Builds the shared package dists and bundles the bruno-js sandbox libraries.
      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run Unit Tests
        uses: ./.github/actions/tests/run-unit-tests

  e2e-test:
    name: E2E Tests ${{ matrix.shard }}/${{ matrix.shardTotal }}
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    # Caps Playwright concurrency (honored by playwright.config.ts). Each worker launches a
    # full Electron app, so one-per-core starves them into spurious step timeouts on a hosted
    # runner. Set at job level so it reaches the composite action's steps.
    env:
      PLAYWRIGHT_WORKERS: '2'
    strategy:
      fail-fast: false
      matrix:
        shardTotal: [4]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install -y \
            libglib2.0-0 libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2t64 \
            xvfb \
            gsettings-desktop-schemas dbus-x11

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Configure Chrome Sandbox
        run: |
          CHROME_SANDBOX="${GITHUB_WORKSPACE}/node_modules/electron/dist/chrome-sandbox"
          if [[ -f "$CHROME_SANDBOX" ]]; then
            sudo chown root "$CHROME_SANDBOX"
            sudo chmod 4755 "$CHROME_SANDBOX"
          fi

      - name: Run E2E Tests
        uses: ./.github/actions/tests/run-e2e-tests
        with:
          os: ubuntu
          shard: ${{ matrix.shard }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: blob-report-develop-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  e2e-test-report:
    name: Merge E2E Reports
    if: ${{ !cancelled() }}
    needs: [e2e-test]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      - name: Download blob reports
        uses: actions/download-artifact@v6
        with:
          path: all-blob-reports
          pattern: blob-report-develop-*
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --config=playwright.merge.config.ts ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-develop
          path: playwright-report/
          retention-days: 30
